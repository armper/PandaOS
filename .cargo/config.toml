# Cargo configuration for PandaOS

[alias]
# Kernel-specific build commands that use build-std
kbuild = "build --target x86_64-unknown-none -Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"
ktest = "test --target x86_64-unknown-none -Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"
krun = "run --target x86_64-unknown-none -Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"

[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
runner = "bootimage runner"
linker = "rust-lld"
rustflags = ["-C", "link-arg=-Tkernel/linker.ld"]
